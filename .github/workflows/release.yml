name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token lets npm mint a Sigstore provenance statement, so the published
    # package carries a verifiable link back to this repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # The toolchain is bun: bun.lock is the lockfile and the test runner is
      # bun test.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          # Never reuse a cache in a release build.
          cache: false

      - name: Verify
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}